name: Publish to VS Code Marketplace

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm i -g pnpm
      - run: npm ci

      # No runtime dependencies, so skip the install vsce would otherwise run.
      - run: npx @vscode/vsce@4 publish --oidc --no-dependencies
